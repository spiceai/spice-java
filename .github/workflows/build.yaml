name: build

on:
  push:
    branches: ['trunk']
  pull_request:
    branches: ['trunk']
  workflow_dispatch:

jobs:
  build_multi_os:
    name: Build and test ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Oracle)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle
          cache: maven

      - name: Display Java version
        run: java -version

      - name: Display Javac version
        run: javac -version

      - name: Display Maven version
        run: mvn -version

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        run: mvn install -DskipTests=true -Dgpg.skip -B -V

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: mvn --% install -DskipTests=true -Dgpg.skip -B -V # tell powershell to stop parsing with --% so it doesn't error with "Unknown lifecycle phase .skip"

      - name: Install Spice (https://install.spiceai.org) (Unix)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The installer resolves the latest release via the GitHub API, which
        # intermittently fails from runner IPs (empty version -> corrupt
        # archive). Retry with backoff and verify the binary actually works.
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://install.spiceai.org | /bin/bash && "$HOME/.spice/bin/spice" version; then
              break
            fi
            echo "Spice CLI install failed (attempt $attempt); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          "$HOME/.spice/bin/spice" version
          echo "$HOME/.spice/bin" >> $GITHUB_PATH
          $HOME/.spice/bin/spice install

      - name: install Spice (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ok = $false
          foreach ($attempt in 1..5) {
            try {
              curl.exe -fsSL "https://install.spiceai.org/Install.ps1" -o Install.ps1
              PowerShell -ExecutionPolicy Bypass -File ./Install.ps1
              & (Join-Path $HOME ".spice\bin\spice.exe") version
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            } catch {
              Write-Host "Spice CLI install failed (attempt $attempt): $_"
            }
            Start-Sleep -Seconds ($attempt * 10)
          }
          if (-not $ok) { throw "Spice CLI install failed after retries" }

      - name: add Spice bin to PATH (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Add-Content $env:GITHUB_PATH (Join-Path $HOME ".spice\bin")
        shell: pwsh

      - name: Init and start spice app (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          spice init spice_qs
          cd spice_qs
          # Define the dataset inline rather than fetching spiceai/quickstart from
          # the Spicepod registry, which currently returns a body the CLI cannot
          # unpack ("Failed to extract Spicepod archive: Could not find EOCD").
          cat >> spicepod.yaml <<'YAML'

          datasets:
            - from: s3://spiceai-demo-datasets/taxi_trips/2024/
              name: taxi_trips
              description: taxi trips in s3
              params:
                file_format: parquet
              acceleration:
                enabled: true
          YAML
          spiced &> spice.log &
          # time to initialize added dataset
          sleep 10

      - name: Init and start spice app (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          spice init spice_qs
          cd spice_qs
          # Define the dataset inline rather than fetching spiceai/quickstart from
          # the Spicepod registry, which currently returns a body the CLI cannot
          # unpack ("Failed to extract Spicepod archive: Could not find EOCD").
          @'

          datasets:
            - from: s3://spiceai-demo-datasets/taxi_trips/2024/
              name: taxi_trips
              description: taxi trips in s3
              params:
                file_format: parquet
              acceleration:
                enabled: true
          '@ | Add-Content -Path spicepod.yaml
          Start-Process -FilePath spice run
          # time to initialize added dataset
          Start-Sleep -Seconds 10
        shell: pwsh

      - name: Test
        run: mvn test -B
        env:
          API_KEY: ${{ secrets.SPICE_CLOUD_QUICKSTART_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: target/site/jacoco/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java:
          # Microsoft OpenJDK (LTS versions only)
          - version: 11
            distribution: microsoft
          - version: 17
            distribution: microsoft
          - version: 21
            distribution: microsoft # LTS
          # Eclipse Temurin (Adoptium) - LTS and recent non-LTS
          - version: 21
            distribution: temurin # LTS
          - version: 23
            distribution: temurin # Non-LTS - released Sept 2024
          - version: 24
            distribution: temurin # Non-LTS - released March 2025
          # Oracle JDK (17 and later only)
          - version: 17
            distribution: oracle
          - version: 21
            distribution: oracle # LTS - support until 2031
          - version: 23
            distribution: oracle # Non-LTS - released Sept 2024
          - version: 24
            distribution: oracle # Non-LTS - released March 2025
          - version: 25
            distribution: oracle # LTS - released Sept 2025, support until 2033

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java.version }} (${{ matrix.java.distribution }})
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java.version }}
          distribution: ${{ matrix.java.distribution }}
          cache: maven

      - name: Display Java version
        run: java -version

      - name: Display Javac version
        run: javac -version

      - name: Display Maven version
        run: mvn -version

      - name: Build
        run: mvn install -DskipTests=true -Dgpg.skip -B -V

      - name: Install Spice (https://install.spiceai.org)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Authenticated + retried: the installer's release lookup intermittently
        # fails from runner IPs without a token (this step caused most CI flakes).
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://install.spiceai.org | /bin/bash && "$HOME/.spice/bin/spice" version; then
              break
            fi
            echo "Spice CLI install failed (attempt $attempt); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          "$HOME/.spice/bin/spice" version
          echo "$HOME/.spice/bin" >> $GITHUB_PATH

      - name: Init and start spice app
        run: |
          spice init spice_qs
          cd spice_qs
          # Define the dataset inline rather than fetching spiceai/quickstart from
          # the Spicepod registry, which currently returns a body the CLI cannot
          # unpack ("Failed to extract Spicepod archive: Could not find EOCD").
          cat >> spicepod.yaml <<'YAML'

          datasets:
            - from: s3://spiceai-demo-datasets/taxi_trips/2024/
              name: taxi_trips
              description: taxi trips in s3
              params:
                file_format: parquet
              acceleration:
                enabled: true
          YAML
          spice run &> spice.log &
          # time to initialize added dataset
          sleep 10

      - name: Test
        run: |
          EXTRA=""
          # JDK 23+ disables sun.misc.Unsafe memory methods by default (JEP 471).
          # Arrow/Netty still require them for off-heap memory allocation.
          if [ "${{ matrix.java.version }}" -ge 23 ] 2>/dev/null; then
            EXTRA="--sun-misc-unsafe-memory-access=allow"
          fi
          mvn test -B -DextraArgLine="$EXTRA"
        env:
          API_KEY: ${{ secrets.SPICE_CLOUD_QUICKSTART_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk${{ matrix.java.version }}-${{ matrix.java.distribution }}
          path: target/surefire-reports/
          retention-days: 7

  quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Oracle)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle
          cache: maven

      - name: Build
        run: mvn install -DskipTests=true -Dgpg.skip -B -V

      - name: Maven Enforcer
        run: mvn validate -B

      - name: SpotBugs
        run: mvn spotbugs:check -B

      - name: Checkstyle
        run: mvn checkstyle:check -B

      - name: API compatibility (japicmp vs latest release)
        run: mvn japicmp:cmp -B

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-

      # Split so network flakiness and the security gate can't mask each other:
      # the NVD data refresh may fail or time out without blocking CI, but the
      # actual vulnerability check below runs offline against whatever data is
      # cached and FAILS the build on real CVSS >= 7 findings.
      - name: OWASP NVD data update (best-effort)
        continue-on-error: true
        timeout-minutes: 15
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "$NVD_API_KEY" ]; then
            EXTRA="-DnvdApiKey=$NVD_API_KEY"
          fi
          mvn dependency-check:update-only -B $EXTRA

      - name: OWASP Dependency-Check (gating)
        timeout-minutes: 10
        run: mvn dependency-check:check -B -DautoUpdate=false

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

  e2e-chaos:
    name: E2E chaos (runtime restart, frozen peer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Oracle)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle
          cache: maven

      - name: Build
        run: mvn install -DskipTests=true -Dgpg.skip -B -V

      - name: Install Spice (https://install.spiceai.org)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://install.spiceai.org | /bin/bash && "$HOME/.spice/bin/spice" version; then
              break
            fi
            echo "Spice CLI install failed (attempt $attempt); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          "$HOME/.spice/bin/spice" version
          echo "$HOME/.spice/bin" >> $GITHUB_PATH
          $HOME/.spice/bin/spice install

      # The chaos tests start, kill, freeze, and restart their own spiced
      # process (no datasets needed), validating end-to-end that the SDK
      # survives runtime crashes, restarts, and frozen peers.
      - name: Run chaos e2e tests
        env:
          SPICE_E2E_CHAOS: "1"
        run: mvn test -B -Dtest=ChaosE2ETest -DfailIfNoTests=true
