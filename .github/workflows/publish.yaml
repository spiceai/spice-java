name: publish (Maven Central)

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The GPG signing key is deliberately NOT imported here: it is imported
      # in a dedicated step immediately before publishing, after every piece
      # of downloaded third-party code has already run.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 17
          cache: maven

      - name: Verify version consistency
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          JAVA_VERSION=$(grep -oP 'SPICE_JAVA_VERSION = "\K[^"]+' src/main/java/ai/spice/Version.java)
          echo "pom.xml version: $POM_VERSION"
          echo "Version.java version: $JAVA_VERSION"
          if [ "$POM_VERSION" != "$JAVA_VERSION" ]; then
            echo "ERROR: Version mismatch between pom.xml ($POM_VERSION) and Version.java ($JAVA_VERSION)"
            exit 1
          fi
          # The japicmp gate must compare against the previous release, never
          # the one being published (a self-comparison is vacuous).
          JAPICMP_OLD=$(mvn help:evaluate -Dexpression=japicmp.oldVersion -q -DforceStdout)
          echo "japicmp.oldVersion: $JAPICMP_OLD"
          if [ "$JAPICMP_OLD" = "$POM_VERSION" ]; then
            echo "ERROR: japicmp.oldVersion equals the version being released; bump it to the previous release"
            exit 1
          fi

      - name: Build
        run: make build

      # Release-context install: pinned version, checksum-verified — the
      # publish pipeline must never execute mutable remote code (the dev CI
      # convenience installer is not used here). Bump the version and digests
      # together when updating the runtime under test.
      - name: Install Spice (pinned + checksum-verified)
        env:
          SPICE_VERSION: v2.1.2
          SPICE_CLI_SHA256: 0a4ced62280ddd17c895a6e2ac1d6007d581a4672cd147f24cf166ec2c4565d9
          SPICED_SHA256: bcafacedd24148d97b71cecb482812ced21d26dbbeaed195075fb91bc07c9242
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.spice/bin"
          curl -fsSL --retry 5 --retry-delay 10 -o spice_cli.tar.gz \
            "https://github.com/spiceai/spiceai/releases/download/${SPICE_VERSION}/spice_linux_x86_64.tar.gz"
          echo "${SPICE_CLI_SHA256}  spice_cli.tar.gz" | sha256sum -c -
          tar -xzf spice_cli.tar.gz -C "$HOME/.spice/bin"
          curl -fsSL --retry 5 --retry-delay 10 -o spiced_rt.tar.gz \
            "https://github.com/spiceai/spiceai/releases/download/${SPICE_VERSION}/spiced_linux_x86_64.tar.gz"
          echo "${SPICED_SHA256}  spiced_rt.tar.gz" | sha256sum -c -
          tar -xzf spiced_rt.tar.gz -C "$HOME/.spice/bin"
          "$HOME/.spice/bin/spice" version
          echo "$HOME/.spice/bin" >> $GITHUB_PATH

      - name: Init and start spice app
        run: |
          spice init spice_qs
          cd spice_qs
          # Define the dataset inline rather than fetching spiceai/quickstart from
          # the Spicepod registry, which currently returns a body the CLI cannot
          # unpack ("Failed to extract Spicepod archive: Could not find EOCD").
          cat >> spicepod.yaml <<'YAML'

          datasets:
            - from: s3://spiceai-demo-datasets/taxi_trips/2024/
              name: taxi_trips
              description: taxi trips in s3
              params:
                file_format: parquet
              acceleration:
                enabled: true
          YAML
          spice run &> spice.log &
          # time to initialize added dataset
          sleep 10

      - name: Run tests
        run: make test
        env:
          API_KEY: ${{ secrets.SPICE_CLOUD_QUICKSTART_API_KEY }}

      # Import the signing key only now — after the runtime download and the
      # test run — so no earlier step ever executes with the key in the keyring.
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Publish to Maven Central
        env:
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: make publish
